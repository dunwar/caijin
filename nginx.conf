server {
    listen 80;
    server_name caijin.gaozhong.online;

    root /var/lib/openclaw/www/caijin.gaozhong.online;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 1d;
        add_header Cache-Control "public, immutable";
    }
}
