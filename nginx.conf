# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name caijin.gaozhong.online;
    return 301 https://$host$request_uri;
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name caijin.gaozhong.online;

    # SSL 证书
    ssl_certificate /var/lib/openclaw/certs/gaozhong.online.pem;
    ssl_certificate_key /var/lib/openclaw/certs/gaozhong.online.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    root /var/lib/openclaw/www/caijin.gaozhong.online;
    index index.html;

    # ACME 验证路径（证书续期用）
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/openclaw/www/caijin.gaozhong.online;
        default_type text/plain;
    }

    # SPA 路由支持
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # 静态文件缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
