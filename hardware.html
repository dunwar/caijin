<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI硬件监控 · caijin.gaozhong.online</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
:root{--bg:#f8f9fa;--card:#fff;--t1:#1a1a2e;--t2:#6b7280;--t3:#9ca3af;--bd:#e5e7eb;--steel:#2563eb;--red:#dc2626;--green:#16a34a;--sh:0 1px 3px rgba(0,0,0,.08);--r:10px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);line-height:1.6}
.header{background:var(--card);padding:12px 14px;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bd);box-shadow:0 1px 2px rgba(0,0,0,.04)}
.header .toprow{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.header .toprow a{color:var(--t2);text-decoration:none;font-size:18px}
.header h1{font-size:17px;font-weight:700}
.header .sub{font-size:11px;color:var(--t3)}
.nav{display:flex;gap:6px}
.nav a{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;text-decoration:none;border:1px solid var(--bd);color:var(--t2);transition:all .15s}
.nav a:hover:not(.cur){background:var(--bg)}
.nav a.cur{background:var(--steel);color:#fff;border-color:var(--steel);font-weight:700}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 14px;box-shadow:var(--sh)}
.ttl{font-size:13px;font-weight:700;color:var(--t2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
.chart{width:100%;height:260px}
.rz-row{text-align:right;margin:0 0 2px}
.rz{display:inline-block;padding:2px 10px;margin-left:6px;font-size:11px;border:1px solid var(--bd);border-radius:12px;color:var(--t2);cursor:pointer;user-select:none}
.rz.on{background:var(--steel);color:#fff;border-color:var(--steel);font-weight:600}
.tbl{width:100%;font-size:12px;border-collapse:collapse}
.tbl th,.tbl td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd)}
.tbl th{font-size:10px;color:var(--t3);font-weight:600}
.tbl td:first-child,.tbl th:first-child{text-align:left}.tbl .nm{font-weight:600}
.news-list{list-style:none}.news-list li{padding:9px 0;border-bottom:1px solid var(--bd);font-size:13px}
.news-list li:last-child{border:none}.news-list a{color:var(--t1);text-decoration:none}.news-list .snip{font-size:11px;color:var(--t2);margin-top:2px}
.trend-hint{text-align:center;font-size:10px;color:var(--t3);margin-top:4px;padding:20px 0}
.up{color:var(--red)}.dn{color:var(--green)}
</style>
</head>
<body>
<div class="header"><div class="toprow"><a href="index.html">←</a><div><h1>🔧 AI硬件</h1><div class="sub" id="upd">加载中...</div></div></div><div class="nav"><a href="baijiu.html">🍶 白酒</a><a class="cur">🔧 硬件</a><a href="software.html">💻 软件</a></div></div>

<div class="card"><div class="ttl">🧠 DRAM 内存现货价 <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:6px" id="dt-dram"></span></div><div class="rz-row" id="rz-dram"></div><div class="chart" id="ch-dram"></div><div style="overflow-x:auto;margin-top:10px"><table class="tbl" id="tbl-dram"></table></div></div>
<div class="card"><div class="ttl">📡 半导体新闻 (DigiTimes RSS)</div><ul class="news-list" id="news-hw"></ul></div>
<div class="card"><div class="ttl">🔌 光模块参考价 <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:6px" id="dt-opt"></span></div><div style="overflow-x:auto"><table class="tbl" id="tbl-opt"></table></div><div class="rz-row" id="rz-opt-trend"></div><div class="chart" id="ch-opt-trend"></div></div>
<div class="card"><div class="ttl">☁️ GPU 云租金 <span style="font-weight:400;font-size:11px;color:var(--t3);margin-left:6px" id="dt-gpu"></span></div><div style="overflow-x:auto"><table class="tbl" id="tbl-gpu"></table></div><div class="rz-row" id="rz-gpu-trend"></div><div class="chart" id="ch-gpu-trend"></div></div>

<script>
var PAL=['#2563eb','#f59e0b','#10b981','#ec4899','#8b5cf6','#14b8a6','#f97316','#e11d48'];
async function ld(p){try{return(await fetch(p)).json()}catch(e){return null}}

function sparseLbl(n){var st=Math.max(1,Math.ceil(n/6));return function(i){return i%st===0||i===n-1}}
function rangeBtns(el,chart,n){
  if(!el)return;
  var defs=[['1月',30],['3月',90],['全部',0]];
  el.innerHTML=defs.map(function(d,i){return '<span class="rz'+(i===2?' on':'')+'" data-n="'+d[1]+'">'+d[0]+'</span>'}).join('');
  el.onclick=function(e){var t=e.target;if(!t.dataset||t.dataset.n===undefined)return;
    el.querySelectorAll('.rz').forEach(function(x){x.classList.remove('on')});t.classList.add('on');
    var nn=+t.dataset.n,st=(nn>0&&n>nn)?Math.round((1-nn/n)*100):0;
    chart.setOption({dataZoom:[{type:'inside',start:st,end:100},{type:'slider',start:st,end:100}]});};
}

function makeTrendChart(elId, history, names, title, unit){
  var dom=document.getElementById(elId);
  if(!history||history.length<2){
    dom.innerHTML='<div class="trend-hint">📈 趋势曲线需要累积多个历史点·每日凌晨更新</div>'; return;
  }
  var dates=history.map(function(h){return h.date.substring(5)});
  var chart=echarts.init(dom);
  chart.setOption({
    grid:{left:70,right:35,top:40,bottom:48},
    xAxis:{type:'category',data:dates,axisLabel:{fontSize:10,interval:sparseLbl(dates.length)}},
    yAxis:{type:'value',axisLabel:{fontSize:10,formatter:unit||'{value}'}},
    series:names.map(function(n,i){return{name:n,type:'line',data:history.map(function(h){return h[n]||null}),lineStyle:{width:2,color:PAL[i]},symbolSize:3,smooth:true}}),
    legend:{top:5,textStyle:{fontSize:9},itemWidth:12,itemHeight:8},
    tooltip:{trigger:'axis'},
    dataZoom:[{type:'inside'},{type:'slider',height:14,bottom:2}]
  });
  rangeBtns(document.getElementById('rz-'+elId.substring(3)),chart,dates.length);
  window.addEventListener('resize',function(){chart.resize()});
}

(function(){
ld('data/hardware/latest.json').then(function(d){
if(!d)return;
document.getElementById('upd').textContent='更新于 '+d.updated;

// ==== DRAM ====
var dram=d.dram?.items||[],dh=d.dram?.history||[],dm=d.dram?.date||d.updated;
document.getElementById('dt-dram').textContent=dm?'('+dh.length+'个历史点·最新'+dm+')':'';
if(dram.length){
  document.getElementById('tbl-dram').innerHTML='<thead><tr><th>品类</th><th>盘均价</th><th>日高</th><th>日低</th><th>涨跌</th></tr></thead><tbody>'+dram.map(function(i){return'<tr><td class="nm">'+i.name+'</td><td>$'+(i.avgPrice||'——')+'</td><td>$'+(i.dayHigh||'——')+'</td><td>$'+(i.dayLow||'——')+'</td><td class="'+((i.change||'').indexOf('▲')>=0?'up':'dn')+'">'+(i.change||'——')+'</td></tr>'}).join('')+'</tbody>';
}
var ch=echarts.init(document.getElementById('ch-dram'));
if(dh.length>1){
  var dt=dh.map(function(h){return h.date.substring(5)});
  var series=[];
  if(dh.some(function(h){return h.DDR5_16Gb!=null})) series.push({name:'DDR5 16Gb',type:'line',data:dh.map(function(h){return h.DDR5_16Gb||null}),lineStyle:{width:2,color:PAL[0]},symbolSize:3,smooth:true});
  if(dh.some(function(h){return h.DDR5_eTT!=null})) series.push({name:'DDR5 eTT',type:'line',data:dh.map(function(h){return h.DDR5_eTT||null}),lineStyle:{width:2,color:PAL[1]},symbolSize:3,smooth:true});
  if(dh.some(function(h){return h.DDR4_16Gb!=null})) series.push({name:'DDR4 16Gb',type:'line',data:dh.map(function(h){return h.DDR4_16Gb||null}),lineStyle:{width:2,color:PAL[2]},symbolSize:3,smooth:true});
  ch.setOption({grid:{left:50,right:20,top:10,bottom:48},xAxis:{type:'category',data:dt,axisLabel:{fontSize:10,rotate:45,interval:sparseLbl(dt.length)}},yAxis:{type:'value',axisLabel:{fontSize:10,formatter:'${value}'}},series:series,legend:{bottom:24,textStyle:{fontSize:10}},tooltip:{trigger:'axis'},dataZoom:[{type:'inside'},{type:'slider',height:14,bottom:2}]});
  rangeBtns(document.getElementById('rz-dram'),ch,dt.length);
}else{
  var nm=dram.map(function(i){return i.name.length>25?i.name.substring(0,22)+'...':i.name});
  var vl=dram.map(function(i){return i.avgPrice||0});
  ch.setOption({grid:{left:130,right:40,top:10,bottom:30},xAxis:{type:'value',axisLabel:{fontSize:10,formatter:'${value}'}},yAxis:{type:'category',data:nm,inverse:true,axisLabel:{fontSize:10}},series:[{type:'bar',data:vl,itemStyle:{color:'#2563eb',borderRadius:[0,4,4,0]},label:{show:true,position:'right',fontSize:10,formatter:'${c}'}}],tooltip:{trigger:'axis'}});
  document.getElementById('ch-dram').insertAdjacentHTML('afterend','<div class="trend-hint">📈 趋势曲线需要累积多个历史点·每日凌晨自动采集</div>');
}
window.addEventListener('resize',function(){ch.resize()});

// ==== News ====
var arts=d.news?.articles||[];
document.getElementById('news-hw').innerHTML=arts.length?arts.map(function(a){return'<li><a href="'+(a.link||'#')+'" target="_blank">'+a.title+'</a><div class="snip">'+a.snippet+' <span style="color:var(--t3)">'+a.source+' '+a.date+'</span></div></li>'}).join(''):'<li style="color:var(--t3)">暂无新闻</li>';

// ==== Optical Modules ====
var go=d.gpuOptical||{},opt=go.opticalModules||[],oh=go.opticalHistory||[];
document.getElementById('dt-opt').textContent=oh.length?'('+oh.length+'个历史点·最新'+oh[oh.length-1].date+')':'';
document.getElementById('tbl-opt').innerHTML='<thead><tr><th>产品</th><th>参考价</th><th>说明</th></tr></thead><tbody>'+opt.map(function(o){var n=o.name||'';var note='单模10km';if(n.indexOf('SR8')>=0)note='多模100m';else if(n.indexOf('DR4')>=0)note='主流DC';else if(n.indexOf('1.6T')>=0)note='Innolight 2026H2';return'<tr><td class="nm">'+n+'</td><td>'+o.price+'</td><td style="font-size:11px;color:var(--t3)">'+note+'</td></tr>'}).join('')+'</tbody>';
makeTrendChart('ch-opt-trend', oh, ['800G SR8','800G XDR8','400G DR4','1.6T OSFP(估)'], '光模块价格', '${value}');

// ==== GPU Cloud ====
var gpu=go.gpuCloud||[],gh=go.gpuHistory||[];
document.getElementById('dt-gpu').textContent=gh.length?'('+gh.length+'个历史点·最新'+gh[gh.length-1].date+')':'';
document.getElementById('tbl-gpu').innerHTML='<thead><tr><th>云厂商</th><th>价格</th><th>备注</th></tr></thead><tbody>'+gpu.map(function(g){return'<tr><td class="nm">'+g.name+'</td><td>'+g.price+'</td><td style="font-size:11px;color:var(--t3)">'+g.note+'</td></tr>'}).join('')+'</tbody>';
makeTrendChart('ch-gpu-trend', gh, ['AWS H100','Azure H100','GCP H100'], 'GPU云租金', '${value}/hr');

}).catch(function(e){console.error(e)});
})();
</script>
</body>
</html>
